name: Android debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract source archive
        run: |
          unzip -q MoonEditAI_v0.3_source_reviewed_NOT_VERIFIED.zip
          cp -a MoonEditAI/. .

      - name: Migrate Kotlin compiler options
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          old = '    kotlinOptions {\n        jvmTarget = "17"\n    }'
          if old not in s:
              raise SystemExit("Expected Kotlin jvmTarget block was not found; refusing to modify unknown source.")
          s = s.replace(old, "", 1)
          s += '\n\nkotlin {\n    compilerOptions {\n        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)\n    }\n}\n'
          p.write_text(s)
          PY

      - name: Generate complete Gradle wrapper
        run: gradle wrapper --gradle-version 8.13 --distribution-type bin

      - name: Build debug APK
        run: ./gradlew --no-daemon clean :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MoonEditAI-v0.3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit generated wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git commit -m "Add Gradle 8.13 wrapper"
            git push
          fi
